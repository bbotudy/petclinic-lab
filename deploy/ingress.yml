apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: petclinic
  namespace: was
spec:
  ingressClassName: nginx
  rules:
  - host: www.dodo.com
    http:
      paths:
      - path: /clinic
        pathType: Prefix
        backend:
          service:
            name: petclinic
            port:
              number: 8080
