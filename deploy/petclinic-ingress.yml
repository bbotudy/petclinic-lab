apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic
  namespace: was
spec:
  replicas: 3
  selector:
    matchLabels:
      app: petclinic
  template:
    metadata:
      labels:
        app: petclinic
    spec:
      containers:
      - name: petclinic
        image: ldy88/petclinic:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: SERVER_SERVLET_CONTEXT_PATH
          value: /clinic
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 10
        resources:
          requests:
            memory: 384Mi
          limits:
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: petclinic
  namespace: was
spec:
  selector:
    app: petclinic
  ports:
  - port: 8080
    targetPort: 8080
